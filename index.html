<script>
// --- Global Data Structures ---
let inventory = JSON.parse(localStorage.getItem('ng_digital_inventory')) || [];
let services = JSON.parse(localStorage.getItem('ng_digital_services')) || [];
let parts = JSON.parse(localStorage.getItem('ng_digital_parts')) || [];

let editIndex = null;
let editServiceIndex = null;
let editPartIndex = null;

const MY_WHATSAPP_NUMBER = '917439160014'; // Country code + 7439160014

document.getElementById('date').valueAsDate = new Date();
document.getElementById('srvDate').valueAsDate = new Date();
document.getElementById('partDate').valueAsDate = new Date();

// --- Automated WhatsApp Sender ---
function sendToWhatsApp(messageText) {
  const encodedMessage = encodeURIComponent(messageText);
  const whatsappUrl = `https://api.whatsapp.com/send?phone=${MY_WHATSAPP_NUMBER}&text=${encodedMessage}`;
  
  // Opens WhatsApp in a new tab/window automatically
  window.open(whatsappUrl, '_blank');
}

// --- Navigation Tabs Logic ---
function switchPage(pageId, btn) {
  document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById(pageId).classList.add('active');
  btn.classList.add('active');
}

// --- PAGE 1: Buy & Sell Logic ---
function toggleOtherProductInput() {
  const productSelect = document.getElementById('product').value;
  const otherBox = document.getElementById('otherProductBox');
  otherBox.style.display = (productSelect === 'Other') ? 'block' : 'none';
}

function toggleCustomInvestment() {
  const investorVal = document.getElementById('investor').value;
  const nayanBox = document.getElementById('nayanCustomBox');
  const ashidBox = document.getElementById('ashidCustomBox');

  if (investorVal === 'Custom') {
    nayanBox.style.display = 'block';
    ashidBox.style.display = 'block';
  } else {
    nayanBox.style.display = 'none';
    ashidBox.style.display = 'none';
  }
}

function renderData() {
  const tbody = document.getElementById('inventoryList');
  const searchQuery = document.getElementById('search').value.toLowerCase();
  tbody.innerHTML = '';

  let totalCostSum = 0;
  let totalSalesSum = 0;
  let totalProfitSum = 0;
  let inStockCostSum = 0;

  let nayanTotalInvest = 0;
  let ashidTotalInvest = 0;
  let nayanTotalProfit = 0;
  let ashidTotalProfit = 0;

  inventory.forEach((item, index) => {
    const totalCost = Number(item.buyPrice) + Number(item.transport) + Number(item.repair);
    const profit = item.status === 'Sold' ? Number(item.sellPrice) - totalCost : 0;
    const partnerProfitShare = item.status === 'Sold' ? profit / 2 : 0;

    let investorDisplay = item.investor;
    let nayanItemInvest = 0;
    let ashidItemInvest = 0;

    if (item.investor === 'Nayan Gain') {
      nayanItemInvest = totalCost;
    } else if (item.investor === 'Ashid Bose') {
      ashidItemInvest = totalCost;
    } else if (item.investor === 'Custom') {
      nayanItemInvest = Number(item.nayanCustomAmount) || 0;
      ashidItemInvest = Number(item.ashidCustomAmount) || 0;
      investorDisplay = `Custom (N: ₹${nayanItemInvest} / A: ₹${ashidItemInvest})`;
    } else {
      nayanItemInvest = totalCost / 2;
      ashidItemInvest = totalCost / 2;
    }

    nayanTotalInvest += nayanItemInvest;
    ashidTotalInvest += ashidItemInvest;
    totalCostSum += totalCost;

    if (item.status === 'Sold') {
      totalSalesSum += Number(item.sellPrice);
      totalProfitSum += profit;
      nayanTotalProfit += partnerProfitShare;
      ashidTotalProfit += partnerProfitShare;
    } else {
      inStockCostSum += totalCost;
    }

    const itemCompany = item.company || '-';
    const displayProduct = item.product === 'Other' ? (item.otherProduct || 'Other') : item.product;

    if (
      displayProduct.toLowerCase().includes(searchQuery) || 
      itemCompany.toLowerCase().includes(searchQuery) ||
      item.status.toLowerCase().includes(searchQuery) ||
      investorDisplay.toLowerCase().includes(searchQuery)
    ) {
      const statusClass = item.status === 'In Stock' ? 'stock' : 'sold';
      const profitClass = profit >= 0 ? 'profit' : 'loss';

      tbody.innerHTML += `
        <tr>
          <td>${item.date}</td>
          <td><strong>${displayProduct}</strong></td>
          <td>${itemCompany}</td>
          <td>${investorDisplay}</td>
          <td>₹${totalCost}</td>
          <td>₹${item.sellPrice || 0}</td>
          <td class="${profitClass}">₹${item.status === 'Sold' ? profit : 0}</td>
          <td class="${profitClass}">₹${partnerProfitShare}</td>
          <td class="${profitClass}">₹${partnerProfitShare}</td>
          <td><span class="status ${statusClass}">${item.status}</span></td>
          <td class="action">
            <button class="edit" onclick="editItem(${index})">Edit</button>
            <button class="delete" onclick="deleteItem(${index})">Delete</button>
          </td>
        </tr>
      `;
    }
  });

  const recoveryPercent = totalCostSum > 0 ? Math.min(Math.round((totalSalesSum / totalCostSum) * 100), 100) : 0;
  document.getElementById('progressBar').style.width = recoveryPercent + '%';
  document.getElementById('recoveryPercent').innerText = `Capital Recovered: ${recoveryPercent}%`;
  document.getElementById('stockValue').innerText = `In-Stock Capital: ₹${inStockCostSum}`;

  document.getElementById('totalItems').innerText = inventory.length;
  document.getElementById('totalCost').innerText = '₹' + totalCostSum;
  document.getElementById('totalSales').innerText = '₹' + totalSalesSum;
  document.getElementById('totalProfit').innerText = '₹' + totalProfitSum;

  document.getElementById('nayanInvest').innerText = 'Invested: ₹' + nayanTotalInvest;
  document.getElementById('nayanProfit').innerText = 'Profit Share: ₹' + nayanTotalProfit;
  document.getElementById('ashidInvest').innerText = 'Invested: ₹' + ashidTotalInvest;
  document.getElementById('ashidProfit').innerText = 'Profit Share: ₹' + ashidTotalProfit;

  localStorage.setItem('ng_digital_inventory', JSON.stringify(inventory));
}

function saveItem() {
  const date = document.getElementById('date').value;
  const product = document.getElementById('product').value;
  const otherProduct = document.getElementById('otherProduct').value;
  const company = document.getElementById('company').value;
  const buyPrice = document.getElementById('buyPrice').value;
  const transport = document.getElementById('transport').value || 0;
  const repair = document.getElementById('repair').value || 0;
  const investor = document.getElementById('investor').value;
  const nayanCustomAmount = document.getElementById('nayanCustomAmount').value || 0;
  const ashidCustomAmount = document.getElementById('ashidCustomAmount').value || 0;
  const sellPrice = document.getElementById('sellPrice').value || 0;
  const status = document.getElementById('status').value;

  if (!date || !buyPrice) {
    alert('Date and Buy Price are required!');
    return;
  }

  const itemData = { date, product, otherProduct, company, buyPrice, transport, repair, investor, nayanCustomAmount, ashidCustomAmount, sellPrice, status };
  const actionType = editIndex === null ? 'NEW PRODUCT ENTRY' : 'UPDATED PRODUCT ENTRY';

  if (editIndex === null) {
    inventory.push(itemData);
  } else {
    inventory[editIndex] = itemData;
    editIndex = null;
  }

  // Construct WhatsApp Message
  const displayProdName = product === 'Other' ? (otherProduct || 'Other') : product;
  const totalCostCalc = Number(buyPrice) + Number(transport) + Number(repair);
  let waMsg = `*⚡ NG COOLING SOLUTION - ${actionType} ⚡*\n\n`;
  waMsg += `📅 Date: ${date}\n`;
  waMsg += `📦 Product: ${displayProdName} (${company || 'N/A'})\n`;
  waMsg += `💰 Total Cost: ₹${totalCostCalc} (Buy: ₹${buyPrice}, Trans: ₹${transport}, Repair: ₹${repair})\n`;
  waMsg += `🏷️ Sell Price: ₹${sellPrice || 0}\n`;
  waMsg += `👥 Investor: ${investor}\n`;
  waMsg += `📌 Status: ${status}`;

  sendToWhatsApp(waMsg);

  resetForm();
  renderData();
}

function editItem(index) {
  const item = inventory[index];
  document.getElementById('date').value = item.date;
  document.getElementById('product').value = item.product || 'AC';
  document.getElementById('otherProduct').value = item.otherProduct || '';
  document.getElementById('company').value = item.company || '';
  document.getElementById('buyPrice').value = item.buyPrice;
  document.getElementById('transport').value = item.transport;
  document.getElementById('repair').value = item.repair;
  document.getElementById('investor').value = item.investor;
  document.getElementById('nayanCustomAmount').value = item.nayanCustomAmount || '';
  document.getElementById('ashidCustomAmount').value = item.ashidCustomAmount || '';
  document.getElementById('sellPrice').value = item.sellPrice;
  document.getElementById('status').value = item.status;

  toggleOtherProductInput();
  toggleCustomInvestment();

  editIndex = index;
  document.getElementById('formTitle').innerText = '✏️ Edit Product Record';
  document.getElementById('saveBtn').innerText = 'Update Record';
  document.getElementById('cancelBtn').style.display = 'inline-block';
}

function deleteItem(index) {
  if (confirm('Delete this product entry?')) {
    inventory.splice(index, 1);
    renderData();
  }
}

function resetForm() {
  document.getElementById('date').valueAsDate = new Date();
  document.getElementById('product').selectedIndex = 0;
  document.getElementById('otherProduct').value = '';
  document.getElementById('company').value = '';
  document.getElementById('buyPrice').value = '';
  document.getElementById('transport').value = '0';
  document.getElementById('repair').value = '0';
  document.getElementById('investor').value = 'Both (50-50)';
  document.getElementById('nayanCustomAmount').value = '';
  document.getElementById('ashidCustomAmount').value = '';
  document.getElementById('sellPrice').value = '';
  document.getElementById('status').value = 'In Stock';

  toggleOtherProductInput();
  toggleCustomInvestment();

  editIndex = null;
  document.getElementById('formTitle').innerText = '➕ Product Entry & Investment';
  document.getElementById('saveBtn').innerText = 'Save Record';
  document.getElementById('cancelBtn').style.display = 'none';
}

// --- PAGE 2: Service & Repairing Logic ---
function renderServiceData() {
  const tbody = document.getElementById('serviceList');
  const searchQuery = document.getElementById('srvSearch').value.toLowerCase();
  tbody.innerHTML = '';

  let srvTotalIncome = 0;
  let srvTotalCost = 0;
  let srvTotalProfit = 0;

  services.forEach((srv, index) => {
    const totalCharge = Number(srv.charge) || 0;
    const partsCost = Number(srv.partsCost) || 0;
    const techCharge = Number(srv.techCharge) || 0;
    const totalExp = partsCost + techCharge;
    const netProfit = srv.status === 'Completed' ? (totalCharge - totalExp) : 0;
    const profitShare = srv.status === 'Completed' ? netProfit / 2 : 0;

    if (srv.status === 'Completed') {
      srvTotalIncome += totalCharge;
      srvTotalCost += totalExp;
      srvTotalProfit += netProfit;
    }

    if (
      (srv.customer && srv.customer.toLowerCase().includes(searchQuery)) ||
      (srv.category && srv.category.toLowerCase().includes(searchQuery)) ||
      (srv.status && srv.status.toLowerCase().includes(searchQuery))
    ) {
      const statusClass = srv.status === 'Completed' ? 'completed' : 'pending';
      const profitClass = netProfit >= 0 ? 'profit' : 'loss';

      tbody.innerHTML += `
        <tr>
          <td>${srv.date}</td>
          <td><strong>${srv.customer || 'Guest'}</strong></td>
          <td>${srv.category}</td>
          <td>₹${totalCharge}</td>
          <td>₹${partsCost}</td>
          <td>₹${techCharge}</td>
          <td class="${profitClass}">₹${netProfit}</td>
          <td class="${profitClass}">₹${profitShare}</td>
          <td class="${profitClass}">₹${profitShare}</td>
          <td><span class="status ${statusClass}">${srv.status}</span></td>
          <td class="action">
            <button class="edit" onclick="editServiceItem(${index})">Edit</button>
            <button class="delete" onclick="deleteServiceItem(${index})">Delete</button>
          </td>
        </tr>
      `;
    }
  });

  document.getElementById('srvTotalCalls').innerText = services.length;
  document.getElementById('srvTotalIncome').innerText = '₹' + srvTotalIncome;
  document.getElementById('srvTotalCost').innerText = '₹' + srvTotalCost;
  document.getElementById('srvTotalProfit').innerText = '₹' + srvTotalProfit;

  const partnerShare = srvTotalProfit / 2;
  document.getElementById('srvNayanProfit').innerText = 'Profit Share: ₹' + partnerShare;
  document.getElementById('srvAshidProfit').innerText = 'Profit Share: ₹' + partnerShare;

  localStorage.setItem('ng_digital_services', JSON.stringify(services));
}

function saveServiceItem() {
  const date = document.getElementById('srvDate').value;
  const customer = document.getElementById('srvCustomer').value;
  const category = document.getElementById('srvCategory').value;
  const charge = document.getElementById('srvCharge').value;
  const partsCost = document.getElementById('srvPartsCost').value || 0;
  const techCharge = document.getElementById('srvTechCharge').value || 0;
  const status = document.getElementById('srvStatus').value;

  if (!date || !charge) {
    alert('Date and Total Charge are required!');
    return;
  }

  const srvData = { date, customer, category, charge, partsCost, techCharge, status };
  const actionType = editServiceIndex === null ? 'NEW SERVICE RECORD' : 'UPDATED SERVICE RECORD';

  if (editServiceIndex === null) {
    services.push(srvData);
  } else {
    services[editServiceIndex] = srvData;
    editServiceIndex = null;
  }

  // Construct WhatsApp Message for Service
  let waMsg = `*⚡ NG COOLING SOLUTION - ${actionType} ⚡*\n\n`;
  waMsg += `📅 Date: ${date}\n`;
  waMsg += `👤 Customer: ${customer || 'Guest'}\n`;
  waMsg += `🛠️ Service: ${category}\n`;
  waMsg += `💵 Charge: ₹${charge}\n`;
  waMsg += `🔧 Expenses: Parts ₹${partsCost} | Tech ₹${techCharge}\n`;
  waMsg += `📌 Status: ${status}`;

  sendToWhatsApp(waMsg);

  resetServiceForm();
  renderServiceData();
}

function editServiceItem(index) {
  const srv = services[index];
  document.getElementById('srvDate').value = srv.date;
  document.getElementById('srvCustomer').value = srv.customer || '';
  document.getElementById('srvCategory').value = srv.category;
  document.getElementById('srvCharge').value = srv.charge;
  document.getElementById('srvPartsCost').value = srv.partsCost;
  document.getElementById('srvTechCharge').value = srv.techCharge;
  document.getElementById('srvStatus').value = srv.status;

  editServiceIndex = index;
  document.getElementById('srvFormTitle').innerText = '✏️ Edit Service Record';
  document.getElementById('srvSaveBtn').innerText = 'Update Service Record';
  document.getElementById('srvCancelBtn').style.display = 'inline-block';
}

function deleteServiceItem(index) {
  if (confirm('Delete this service entry?')) {
    services.splice(index, 1);
    renderServiceData();
  }
}

function resetServiceForm() {
  document.getElementById('srvDate').valueAsDate = new Date();
  document.getElementById('srvCustomer').value = '';
  document.getElementById('srvCategory').selectedIndex = 0;
  document.getElementById('srvCharge').value = '';
  document.getElementById('srvPartsCost').value = '0';
  document.getElementById('srvTechCharge').value = '0';
  document.getElementById('srvStatus').value = 'Completed';

  editServiceIndex = null;
  document.getElementById('srvFormTitle').innerText = '🛠️ Service & Repair Work Entry';
  document.getElementById('srvSaveBtn').innerText = 'Save Service Record';
  document.getElementById('srvCancelBtn').style.display = 'none';
}

// --- PAGE 3: Spare Parts Purchase Logic ---
function renderPartData() {
  const tbody = document.getElementById('partsList');
  const searchQuery = document.getElementById('partSearch').value.toLowerCase();
  tbody.innerHTML = '';

  let partTotalSpentSum = 0;
  let partNayanSpentSum = 0;
  let partAshidSpentSum = 0;

  parts.forEach((p, index) => {
    const cost = Number(p.amount) || 0;
    partTotalSpentSum += cost;

    if (p.purchaser === 'Nayan Gain') {
      partNayanSpentSum += cost;
    } else if (p.purchaser === 'Ashid Bose') {
      partAshidSpentSum += cost;
    } else {
      partNayanSpentSum += cost / 2;
      partAshidSpentSum += cost / 2;
    }

    if (
      (p.name && p.name.toLowerCase().includes(searchQuery)) ||
      (p.category && p.category.toLowerCase().includes(searchQuery)) ||
      (p.supplier && p.supplier.toLowerCase().includes(searchQuery))
    ) {
      tbody.innerHTML += `
        <tr>
          <td>${p.date}</td>
          <td><strong>${p.name}</strong></td>
          <td>${p.category}</td>
          <td>₹${cost}</td>
          <td>${p.purchaser}</td>
          <td>${p.supplier || '-'}</td>
          <td class="action">
            <button class="edit" onclick="editPartItem(${index})">Edit</button>
            <button class="delete" onclick="deletePartItem(${index})">Delete</button>
          </td>
        </tr>
      `;
    }
  });

  document.getElementById('partTotalItems').innerText = parts.length;
  document.getElementById('partTotalSpent').innerText = '₹' + partTotalSpentSum;
  document.getElementById('partNayanSpent').innerText = '₹' + partNayanSpentSum;
  document.getElementById('partAshidSpent').innerText = '₹' + partAshidSpentSum;

  localStorage.setItem('ng_digital_parts', JSON.stringify(parts));
}

function savePartItem() {
  const date = document.getElementById('partDate').value;
  const name = document.getElementById('partName').value;
  const category = document.getElementById('partCategory').value;
  const amount = document.getElementById('partAmount').value;
  const purchaser = document.getElementById('partPurchaser').value;
  const supplier = document.getElementById('partSupplier').value;

  if (!date || !name || !amount) {
    alert('Date, Part Name, and Amount are required!');
    return;
  }

  const partData = { date, name, category, amount, purchaser, supplier };
  const actionType = editPartIndex === null ? 'NEW SPARE PART PURCHASE' : 'UPDATED SPARE PART PURCHASE';

  if (editPartIndex === null) {
    parts.push(partData);
  } else {
    parts[editPartIndex] = partData;
    editPartIndex = null;
  }

  // Construct WhatsApp Message for Spare Parts
  let waMsg = `*⚡ NG COOLING SOLUTION - ${actionType} ⚡*\n\n`;
  waMsg += `📅 Date: ${date}\n`;
  waMsg += `🛒 Part Name: ${name} (${category})\n`;
  waMsg += `💵 Amount: ₹${amount}\n`;
  waMsg += `💳 Paid By: ${purchaser}\n`;
  waMsg += `🏪 Supplier: ${supplier || 'N/A'}`;

  sendToWhatsApp(waMsg);

  resetPartForm();
  renderPartData();
}

function editPartItem(index) {
  const p = parts[index];
  document.getElementById('partDate').value = p.date;
  document.getElementById('partName').value = p.name;
  document.getElementById('partCategory').value = p.category;
  document.getElementById('partAmount').value = p.amount;
  document.getElementById('partPurchaser').value = p.purchaser;
  document.getElementById('partSupplier').value = p.supplier || '';

  editPartIndex = index;
  document.getElementById('partFormTitle').innerText = '✏️ Edit Spare Part Record';
  document.getElementById('partSaveBtn').innerText = 'Update Purchase Record';
  document.getElementById('partCancelBtn').style.display = 'inline-block';
}

function deletePartItem(index) {
  if (confirm('Delete this part purchase entry?')) {
    parts.splice(index, 1);
    renderPartData();
  }
}

function resetPartForm() {
  document.getElementById('partDate').valueAsDate = new Date();
  document.getElementById('partName').value = '';
  document.getElementById('partCategory').selectedIndex = 0;
  document.getElementById('partAmount').value = '';
  document.getElementById('partPurchaser').selectedIndex = 0;
  document.getElementById('partSupplier').value = '';

  editPartIndex = null;
  document.getElementById('partFormTitle').innerText = '🛒 Spare Parts Purchase Entry';
  document.getElementById('partSaveBtn').innerText = 'Save Purchase Record';
  document.getElementById('partCancelBtn').style.display = 'none';
}

// Initial Render All Pages
renderData();
renderServiceData();
renderPartData();
</script>
