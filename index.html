<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075985">

<title>N.G Cooling Solution | AC Service & Repair</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Segoe UI",sans-serif;
}

body{
    background:#f1f5f9;
    color:#172033;
}

/* HEADER */
header{
    background:#fff;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#075985;
}

.logo span{
    color:#16a34a;
}

.header-btn{
    background:#16a34a;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

/* HERO */
.hero{
    background:linear-gradient(135deg,#075985,#0284c7,#16a34a);
    color:#fff;
    text-align:center;
    padding:38px 20px;
}

.hero h1{
    font-size:29px;
    margin-bottom:8px;
}

.hero p{
    font-size:14px;
}

.hero-badge{
    display:inline-block;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);
    padding:7px 14px;
    border-radius:30px;
    margin-top:15px;
    font-size:12px;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:22px 15px;
}

/* FAST BOOKING */
.fast-box{
    background:#fff;
    border-radius:16px;
    padding:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.fast-title{
    font-size:19px;
    font-weight:800;
    color:#075985;
    padding:6px;
    margin-bottom:10px;
}

.fast-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.fast-btn{
    border:1px solid #dbeafe;
    background:#f8fafc;
    border-radius:12px;
    padding:12px;
    text-align:left;
    cursor:pointer;
}

.fast-btn strong{
    display:block;
    font-size:13px;
    color:#172033;
}

.fast-btn span{
    display:block;
    color:#15803d;
    font-size:16px;
    font-weight:800;
    margin-top:4px;
}

.fast-btn small{
    color:#64748b;
    font-size:10px;
}

/* SERVICE */
.section-title{
    font-size:20px;
    font-weight:800;
    color:#075985;
    margin-bottom:14px;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.service-card{
    background:#fff;
    border-radius:15px;
    padding:22px 12px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    border:1px solid #e2e8f0;
    cursor:pointer;
    transition:.2s;
}

.service-card:hover{
    transform:translateY(-4px);
}

.service-icon{
    font-size:38px;
    margin-bottom:10px;
}

.service-card h3{
    font-size:15px;
    margin-bottom:5px;
}

.service-card p{
    color:#64748b;
    font-size:11px;
}

/* SERVICE PAGE */
.service-page{
    display:none;
}

.page-header{
    background:#fff;
    border-radius:16px;
    padding:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    margin-bottom:15px;
}

.back-btn{
    border:none;
    background:#e0f2fe;
    color:#075985;
    padding:9px 13px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:12px;
}

.page-title{
    font-size:22px;
    font-weight:800;
    color:#075985;
}

.page-subtitle{
    color:#64748b;
    font-size:13px;
    margin-top:5px;
}

/* SEARCH */
.search-box{
    margin:15px 0;
    display:flex;
    gap:8px;
}

.search-box input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    outline:none;
    font-size:14px;
}

/* CATEGORY */
.category-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:15px;
}

.category-tabs button{
    white-space:nowrap;
    border:none;
    background:#e2e8f0;
    padding:9px 13px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.category-tabs button.active{
    background:#075985;
    color:#fff;
}

/* RATE CARD */
.rate-card{
    background:#fff;
    border-radius:12px;
    margin-bottom:12px;
    border:1px solid #e2e8f0;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.rate-category{
    background:#075985;
    color:#fff;
    padding:11px 13px;
    font-size:14px;
    font-weight:bold;
}

.rate-row{
    padding:13px;
    border-bottom:1px solid #eef2f7;
}

.rate-row:last-child{
    border-bottom:none;
}

.rate-name{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
}

.rate-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.price{
    color:#15803d;
    font-size:16px;
    font-weight:800;
}

.labour{
    color:#ea580c;
    font-size:11px;
    margin-top:3px;
}

.book-btn{
    background:#16a34a;
    color:#fff;
    border:none;
    border-radius:7px;
    padding:8px 10px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.booking-box{

    position:fixed;
    inset:0;
